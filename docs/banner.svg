<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="480" rx="20" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Grid Netting -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="250" y1="0" x2="250" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="550" y1="0" x2="550" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
    <line x1="850" y1="0" x2="850" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
    <line x1="1150" y1="0" x2="1150" y2="480"/>
    <line x1="1300" y1="0" x2="1300" y2="480"/>
    <line x1="0" y1="80" x2="1400" y2="80"/>
    <line x1="0" y1="160" x2="1400" y2="160"/>
    <line x1="0" y1="240" x2="1400" y2="240"/>
    <line x1="0" y1="320" x2="1400" y2="320"/>
    <line x1="0" y1="400" x2="1400" y2="400"/>
  </g>

  <!-- Brand Typography -->
  <g fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    <text x="80" y="85" font-size="15" font-weight="700" letter-spacing="4" fill="#06b6d4">WEAVECRAWL · PUBLISHED RESULTS</text>
    <text x="76" y="195" font-size="88" font-weight="850" letter-spacing="-3" fill="#ffffff">WEAVECRAWL</text>
    <text x="76" y="275" font-size="88" font-weight="850" letter-spacing="-3" fill="url(#cyan-glow)">BENCHMARKS</text>
    <text x="80" y="345" font-size="22" font-weight="500" fill="#94a3b8">An AI agent that finishes real web tasks on live websites.</text>
    <text x="80" y="410" font-size="16" font-weight="600" letter-spacing="1" fill="#10b981">● 72.5% OF 40 LIVE TASKS   ● 16 MIN TOTAL   ● ~$0.08 PER TASK</text>
  </g>

  <!-- Right Side Interactive Architecture Graphic -->
  <g transform="translate(850, 70)">
    <!-- Main Card -->
    <rect x="0" y="0" width="470" height="340" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="470" height="42" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Window dots -->
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>
    <text x="85" y="26" font-family="sans-serif" font-size="13" fill="#64748b">40 live-website tasks, 1 run each</text>
    <text x="40" y="120" font-family="sans-serif" font-size="14" fill="#94a3b8">Sonnet agent</text>
    <text x="40" y="190" font-family="sans-serif" font-size="64" font-weight="800" fill="#10b981">29/40</text>
    <text x="40" y="220" font-family="sans-serif" font-size="14" fill="#94a3b8">72.5% raw · 78% on sites that let us in</text>
    <text x="40" y="270" font-family="sans-serif" font-size="14" fill="#94a3b8">Haiku agent (cheapest model)</text>
    <text x="40" y="310" font-family="sans-serif" font-size="30" font-weight="800" fill="#38bdf8">26/40 · 65% raw</text>
  </g>
</svg>
